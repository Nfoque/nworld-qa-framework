<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="assets/favicon.png">
<title>QAAP — Ferrovial QA Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══ Design Tokens ═══ */
:root {
  --qaap-font-heading: 'Source Serif 4', Georgia, serif;
  --qaap-font: 'DM Sans', system-ui, sans-serif;
  --qaap-font-mono: 'JetBrains Mono', monospace;
  --qaap-bg: #F3F3F3;
  --qaap-bg-card: #FFFFFF;
  --qaap-bg-sidebar: #FFFFFF;
  --qaap-bg-hover: #E1E1E1;
  --qaap-bg-active: #FDF8E8;
  --qaap-border: #E1E1E1;
  --qaap-grey-300: #BFBFBF;
  --qaap-border-light: #F3F3F3;
  --qaap-grey-700: #5D6066;
  --qaap-grey-500: #82858D;
  --qaap-text: #100D25;
  --qaap-text-secondary: #5D6066;
  --qaap-text-tertiary: #82858D;
  --qaap-primary: #1A1A1A;
  --qaap-primary-light: #F0EFEB;
  --qaap-primary-dark: #000000;
  --qaap-success: #16A34A;
  --qaap-success-light: #F0FDF4;
  --qaap-warning: #EC683E;
  --qaap-warning-light: #FFF5F0;
  --qaap-error: #D13B5F;
  --qaap-error-light: #FDF2F5;
  --qaap-info: #1A1A1A;
  --qaap-info-light: #F0EFEB;
  --qaap-radius-sm: 6px;
  --qaap-radius-md: 8px;
  --qaap-radius-lg: 12px;
  --qaap-shadow-sm: 0 1px 2px rgba(16,13,37,0.04);
  --qaap-shadow-md: 0 2px 8px rgba(16,13,37,0.06);
  --qaap-shadow-lg: 0 8px 24px rgba(16,13,37,0.08);
  --qaap-sidebar-width: 232px;
  --qaap-topbar-height: 52px;
}

/* ═══ Reset & Base ═══ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; overflow: hidden; }
body { font-family: var(--qaap-font); font-size: 14px; color: var(--qaap-text); background: var(--qaap-bg); -webkit-font-smoothing: antialiased; }
button { font-family: inherit; border: none; cursor: pointer; background: none; color: inherit; }
input { font-family: inherit; }
::selection { background: var(--qaap-primary); color: white; }

/* ═══ App Shell ═══ */
.app-shell { display: flex; height: 100vh; }
.app-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.app-content { flex: 1; overflow-y: auto; overflow-x: hidden; }

/* ═══ Sidebar ═══ */
.sidebar {
  width: var(--qaap-sidebar-width); background: var(--qaap-bg-sidebar); border-right: 1px solid var(--qaap-border);
  display: flex; flex-direction: column; flex-shrink: 0; height: 100vh; z-index: 10;
}
.sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; }
.sidebar-tenant { padding: 0 16px 12px; display: flex; flex-direction: column; gap: 2px; }
.sidebar-nav { flex: 1; padding: 4px 8px; display: flex; flex-direction: column; gap: 1px; overflow-y: auto; }
.sidebar-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--qaap-radius-sm);
  font-size: 13px; font-weight: 500; color: var(--qaap-text-secondary); transition: all 0.15s; width: 100%; text-align: left;
}
.sidebar-item:hover { background: var(--qaap-bg-hover); color: var(--qaap-text); }
.sidebar-item.active { background: var(--qaap-bg-active); color: var(--qaap-primary); font-weight: 600; }
.sidebar-item.sub { padding: 6px 10px; font-size: 12px; }
.sidebar-badge { margin-left: auto; background: var(--qaap-primary); color: white; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; }
.sidebar-divider { height: 1px; background: var(--qaap-border-light); margin: 4px 16px; }
.sidebar-user { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--qaap-border); margin-top: auto; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--qaap-primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; font-family: var(--qaap-font-heading); flex-shrink: 0; }

/* ═══ TopBar ═══ */
.topbar {
  height: var(--qaap-topbar-height); border-bottom: 1px solid var(--qaap-border); display: flex; align-items: center;
  justify-content: space-between; padding: 0 20px; background: var(--qaap-bg-card); flex-shrink: 0;
}
.topbar-left { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.breadcrumb-link { color: var(--qaap-text-tertiary); }
.breadcrumb-link:hover { color: var(--qaap-primary); }
.breadcrumb-current { color: var(--qaap-text); font-weight: 600; }
.topbar-right { display: flex; align-items: center; gap: 4px; }
.topbar-btn { width: 36px; height: 36px; border-radius: var(--qaap-radius-sm); display: flex; align-items: center; justify-content: center; color: var(--qaap-text-secondary); }
.topbar-btn:hover { background: var(--qaap-bg-hover); }
.notification-dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; background: var(--qaap-error); border-radius: 50%; border: 2px solid var(--qaap-bg-card); }

/* ═══ Screen Content ═══ */
.screen-content { padding: 24px 28px; opacity: 0; transform: translateY(6px); transition: opacity 0.3s, transform 0.3s; }
.screen-visible { opacity: 1; transform: translateY(0); }
.screen-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; gap: 16px; flex-wrap: wrap; }
.screen-title { font-family: var(--qaap-font-heading); font-size: 22px; font-weight: 700; letter-spacing: -0.03em; color: var(--qaap-text); }
.screen-subtitle { font-size: 13px; color: var(--qaap-text-tertiary); margin-top: 2px; }

/* ═══ Buttons ═══ */
.btn-primary { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; background: var(--qaap-primary); color: white; border-radius: var(--qaap-radius-sm); font-size: 13px; font-weight: 600; transition: all 0.15s; }
.btn-primary:hover { background: var(--qaap-primary-dark); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
.btn-outline { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border: 1px solid var(--qaap-border); border-radius: var(--qaap-radius-sm); font-size: 13px; font-weight: 500; color: var(--qaap-text-secondary); transition: all 0.15s; background: white; }
.btn-outline:hover { border-color: var(--qaap-primary); color: var(--qaap-primary); }
.btn-ghost { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--qaap-text-tertiary); }
.btn-ghost:hover { color: var(--qaap-primary); }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-lg { padding: 10px 20px; font-size: 14px; justify-content: center; white-space: nowrap; }
.btn-success { background: var(--qaap-success); color: white; border-radius: var(--qaap-radius-sm); display: inline-flex; align-items: center; gap: 4px; font-weight: 600; }
.btn-tab { padding: 6px 12px; font-size: 12px; font-weight: 500; border-radius: var(--qaap-radius-sm); color: var(--qaap-text-tertiary); border: 1px solid transparent; }
.btn-tab:hover { color: var(--qaap-text); }
.btn-tab-active { background: white; color: var(--qaap-text); border-color: var(--qaap-border); font-weight: 600; box-shadow: var(--qaap-shadow-sm); }
.btn-tab-sm { padding: 4px 10px; font-size: 11px; font-weight: 500; border-radius: var(--qaap-radius-sm); color: var(--qaap-text-tertiary); }

/* ═══ Cards ═══ */
.card { background: var(--qaap-bg-card); border: 1px solid var(--qaap-border); border-radius: var(--qaap-radius-lg); overflow: hidden; }
.card-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--qaap-border-light); }
.card-title { font-family: var(--qaap-font-heading); font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }

/* ═══ Stats Grid ═══ */
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.stat-card { background: var(--qaap-bg-card); border: 1px solid var(--qaap-border); border-radius: var(--qaap-radius-lg); padding: 16px 18px; }
.stat-label { font-size: 12px; color: var(--qaap-text-tertiary); font-weight: 500; margin-bottom: 4px; }
.stat-value { font-family: var(--qaap-font-heading); font-size: 26px; font-weight: 700; letter-spacing: -0.03em; }
.stat-sub { font-size: 11px; color: var(--qaap-text-tertiary); margin-top: 2px; }
.stat-icon { width: 36px; height: 36px; border-radius: var(--qaap-radius-sm); display: flex; align-items: center; justify-content: center; background: var(--qaap-primary-light); color: var(--qaap-primary); }
.stat-trend { font-size: 11px; font-weight: 600; margin-top: 8px; }

/* ═══ Status Badge ═══ */
.status-badge { display: inline-flex; align-items: center; font-weight: 600; border-radius: 20px; white-space: nowrap; font-family: var(--qaap-font); }
.status-pulse { animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

/* ═══ Modality Badge ═══ */
.modality-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; white-space: nowrap; }

/* ═══ Dashboard ═══ */
.dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.plans-table { font-size: 13px; }
.plans-table-header { display: grid; grid-template-columns: 2fr 60px 80px 70px 70px 140px 70px; gap: 8px; padding: 8px 18px; font-size: 11px; font-weight: 600; color: var(--qaap-text-tertiary); text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--qaap-border-light); }
.plans-table-row { display: grid; grid-template-columns: 2fr 60px 80px 70px 70px 140px 70px; gap: 8px; padding: 10px 18px; align-items: center; border-bottom: 1px solid var(--qaap-border-light); cursor: pointer; transition: background 0.1s; }
.plans-table-row:hover { background: var(--qaap-bg-hover); }
.plans-table-row:last-child { border-bottom: none; }
.col-name { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.plan-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.col-sm { display: flex; align-items: center; }
.col-md { display: flex; align-items: center; }
.col-num { font-family: var(--qaap-font-mono); font-size: 13px; font-weight: 500; }

/* Activity Feed */
.activity-feed { padding: 4px 0; }
.activity-item { display: flex; gap: 10px; padding: 10px 18px; align-items: flex-start; }
.activity-dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
.activity-success { background: var(--qaap-success); }
.activity-warning { background: var(--qaap-warning); }
.activity-error { background: var(--qaap-error); }
.activity-info { background: var(--qaap-primary); }
.activity-content { display: flex; flex-direction: column; gap: 2px; }
.activity-text { font-size: 13px; }
.activity-time { font-size: 11px; color: var(--qaap-text-tertiary); }

/* Quick Actions */
.quick-actions { padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.quick-action { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--qaap-radius-md); transition: background 0.1s; text-align: left; }
.quick-action:hover { background: var(--qaap-bg-hover); }
.quick-action-icon { width: 36px; height: 36px; border-radius: var(--qaap-radius-sm); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.quick-action-title { font-size: 13px; font-weight: 600; }
.quick-action-desc { font-size: 11px; color: var(--qaap-text-tertiary); }

/* Execution Mini */
.executions-mini { padding: 4px 0; }
.execution-row { display: flex; align-items: center; gap: 10px; padding: 8px 18px; border-bottom: 1px solid var(--qaap-border-light); }
.execution-row:last-child { border-bottom: none; }
.exec-env { font-size: 11px; font-weight: 600; font-family: var(--qaap-font-mono); color: var(--qaap-text-secondary); min-width: 30px; }
.exec-date { font-size: 12px; color: var(--qaap-text-tertiary); min-width: 100px; }
.exec-bar { flex: 1; height: 6px; border-radius: 3px; background: var(--qaap-border-light); display: flex; overflow: hidden; }
.exec-bar-fill { height: 100%; }
.exec-bar-pass { background: var(--qaap-success); }
.exec-bar-fail { background: var(--qaap-error); }
.exec-rate { font-size: 12px; font-weight: 600; font-family: var(--qaap-font-mono); min-width: 34px; }
.exec-duration { font-size: 11px; color: var(--qaap-text-tertiary); min-width: 50px; }
.exec-trigger { font-size: 11px; color: var(--qaap-text-tertiary); min-width: 50px; text-transform: capitalize; }

/* ═══ Health Dashboard ═══ */
.health-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.health-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 16px; }
.health-plan-card { padding: 16px; border: 1px solid var(--qaap-border); border-radius: var(--qaap-radius-md); cursor: pointer; transition: all 0.15s; }
.health-plan-card:hover { border-color: var(--qaap-primary); box-shadow: var(--qaap-shadow-sm); }
.health-plan-top { display: flex; justify-content: space-between; align-items: flex-start; }
.health-plan-name { font-weight: 600; font-size: 14px; }
.health-plan-rate { font-family: var(--qaap-font-heading); font-size: 24px; font-weight: 700; }
.health-plan-chart { margin-top: 12px; }
.trend-chart { padding: 16px; }
.badge-count { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: var(--qaap-warning-light); color: var(--qaap-warning); }

/* Flaky Tests */
.flaky-list { padding: 4px 0; }
.flaky-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 18px; border-bottom: 1px solid var(--qaap-border-light); }
.flaky-item:last-child { border-bottom: none; }
.flaky-name { font-size: 13px; font-weight: 500; }
.flaky-plan { font-size: 11px; color: var(--qaap-text-tertiary); }
.flaky-stats { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.flaky-rate { display: flex; align-items: center; gap: 6px; }
.flaky-bar { width: 60px; height: 4px; background: var(--qaap-border-light); border-radius: 2px; overflow: hidden; }
.flaky-bar-fill { height: 100%; background: var(--qaap-warning); border-radius: 2px; }
.flaky-pct { font-size: 12px; font-weight: 600; color: var(--qaap-warning); font-family: var(--qaap-font-mono); }
.flaky-date { font-size: 10px; color: var(--qaap-text-tertiary); }

/* Environment Comparison */
.env-comparison { padding: 4px 0; }
.env-table-header, .env-table-row { display: grid; grid-template-columns: 1fr repeat(3, 80px); gap: 8px; padding: 8px 18px; align-items: center; }
.env-table-header { font-size: 11px; font-weight: 600; color: var(--qaap-text-tertiary); text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--qaap-border-light); }
.env-table-row { border-bottom: 1px solid var(--qaap-border-light); font-size: 13px; }
.env-table-row:last-child { border-bottom: none; }
.env-col-label { font-weight: 500; }
.env-col-val { text-align: center; }
.env-rate-pill { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 20px; font-family: var(--qaap-font-mono); }

/* Alerts */
.alerts-list { padding: 4px 0; }
.alert-item { display: flex; gap: 10px; padding: 10px 18px; align-items: flex-start; border-bottom: 1px solid var(--qaap-border-light); }
.alert-item:last-child { border-bottom: none; }
.alert-severity { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; flex-shrink: 0; }
.alert-severity-critical { background: var(--qaap-error-light); color: var(--qaap-error); }
.alert-severity-warning { background: var(--qaap-warning-light); color: var(--qaap-warning); }
.alert-severity-info { background: var(--qaap-info-light); color: var(--qaap-info); }
.alert-message { font-size: 13px; font-weight: 500; }
.alert-meta { font-size: 11px; color: var(--qaap-text-tertiary); margin-top: 2px; }

/* ═══ Login Screen ═══ */
.login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--qaap-bg); position: relative; overflow: hidden; opacity: 0; transition: opacity 0.5s; }
.login-visible { opacity: 1; }
.login-bg { position: absolute; inset: 0; }
.login-grid { position: absolute; inset: 0; background-image: radial-gradient(circle at 1px 1px, var(--qaap-border) 1px, transparent 0); background-size: 32px 32px; opacity: 0.5; }
.login-card { position: relative; width: 400px; background: white; border: 1px solid var(--qaap-border); border-radius: var(--qaap-radius-lg); padding: 32px; box-shadow: var(--qaap-shadow-lg); }
.login-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
.login-tenant { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--qaap-bg); border-radius: var(--qaap-radius-md); margin-bottom: 20px; }
.login-tenant-logo { width: 40px; height: 40px; border-radius: var(--qaap-radius-sm); background: var(--qaap-primary-light); display: flex; align-items: center; justify-content: center; }
.login-divider { text-align: center; font-size: 12px; color: var(--qaap-text-tertiary); margin-bottom: 20px; font-weight: 500; }
.login-sso { display: flex; flex-direction: column; gap: 12px; align-items: center; }
.login-form { display: flex; flex-direction: column; gap: 14px; }
.form-field { display: flex; flex-direction: column; gap: 4px; }
.form-field label { font-size: 12px; font-weight: 600; color: var(--qaap-text-secondary); }
.form-field input { padding: 9px 12px; border: 1px solid var(--qaap-border); border-radius: var(--qaap-radius-sm); font-size: 14px; outline: none; transition: border-color 0.15s; }
.form-field input:focus { border-color: var(--qaap-primary); box-shadow: 0 0 0 3px var(--qaap-primary-light); }
.login-link { font-size: 12px; color: var(--qaap-text-tertiary); text-decoration: underline; }
.login-link:hover { color: var(--qaap-primary); }
.login-footer { display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: var(--qaap-text-tertiary); margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--qaap-border-light); }
.login-spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
<style>
/* ═══ Plan Detail ═══ */
.plan-detail { display: flex; flex-direction: column; height: 100%; opacity: 0; transform: translateY(6px); transition: opacity 0.3s, transform 0.3s; }
.plan-detail.screen-visible { opacity: 1 !important; transform: translateY(0) !important; }
.plan-detail-header { padding: 12px 20px; border-bottom: 1px solid var(--qaap-border); background: var(--qaap-bg-card); flex-shrink: 0; }
.plan-detail-title-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.plan-detail-name { font-family: var(--qaap-font-heading); font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
.plan-detail-actions { display: flex; align-items: center; gap: 8px; }
.plan-provenance { font-size: 11px; color: var(--qaap-text-tertiary); padding: 3px 8px; background: var(--qaap-bg); border-radius: 4px; font-weight: 500; }

/* Clean variant */
.plan-body-clean { display: grid; grid-template-columns: 240px 1fr 300px; flex: 1; min-height: 0; overflow: hidden; }
.plan-body-clean > .scenario-sidebar { border-right: 1px solid var(--qaap-border); }
.plan-body-clean > .chat-panel { border-left: 1px solid var(--qaap-border); }

/* IDE variant */
.plan-ide-header { padding: 8px 16px; }
.plan-body-ide { display: grid; grid-template-columns: 200px 1fr; flex: 1; min-height: 0; overflow: hidden; }
.plan-body-ide > .scenario-sidebar { border-right: 1px solid var(--qaap-border); }
.plan-ide-main { display: flex; flex-direction: column; min-height: 0; }
.plan-ide-editors { flex: 1; min-height: 0; overflow: hidden; }
.plan-ide-bottom { height: 220px; border-top: 1px solid var(--qaap-border); flex-shrink: 0; }

/* AI-First variant */
.plan-body-ai { display: grid; grid-template-columns: 1fr 280px; flex: 1; min-height: 0; overflow: hidden; }
.plan-ai-main { display: flex; flex-direction: column; overflow-y: auto; padding: 16px 20px; gap: 16px; }
.plan-ai-sidebar { border-left: 1px solid var(--qaap-border); background: var(--qaap-bg-card); overflow-y: auto; padding: 0; }
.ai-sidebar-section { padding: 14px 16px; border-bottom: 1px solid var(--qaap-border-light); }
.ai-sidebar-section h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--qaap-text-tertiary); font-weight: 600; margin-bottom: 10px; }
.ai-sidebar-stat { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; }
.ai-sidebar-stat span:first-child { color: var(--qaap-text-secondary); }
.ai-sidebar-stat span:last-child { font-weight: 600; font-family: var(--qaap-font-mono); }

.bp-nav-item { display: flex; align-items: center; gap: 4px; padding: 3px 5px; border-radius: 3px; font-size: 7px; margin-bottom: 2px; color: var(--qaap-text-secondary); }
.bp-nav-active { font-weight: 600; }
.bp-content { flex: 1; padding: 8px; }
.bp-topbar { padding: 4px 6px; border-bottom: 1px solid var(--qaap-border-light); margin-bottom: 6px; }
.bp-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 8px; }
.bp-stat-card { background: white; border: 1px solid var(--qaap-border-light); border-radius: 4px; padding: 6px; text-align: center; }
.bp-btn-sm { color: white; font-size: 7px; font-weight: 600; padding: 3px 8px; border-radius: 3px; width: fit-content; }

/* ═══ Plans List Filters ═══ */
.plans-filters { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; padding: 12px 14px; background: var(--qaap-bg-card); border: 1px solid var(--qaap-border); border-radius: var(--qaap-radius-md); }
.plans-filter-group { display: flex; align-items: center; gap: 6px; }
.plans-filter-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--qaap-text-tertiary); }
.plans-filter-pills { display: flex; gap: 3px; }
.plans-search { display: flex; align-items: center; gap: 6px; margin-left: auto; padding: 5px 10px; border: 1px solid var(--qaap-border); border-radius: var(--qaap-radius-sm); background: white; }
.plans-search-input { border: none; outline: none; font-size: 12px; font-family: var(--qaap-font); width: 140px; }
.market-badge { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 10px; white-space: nowrap; }
.vertical-badge { font-size: 10px; font-weight: 500; color: var(--qaap-text-secondary); padding: 2px 7px; background: var(--qaap-bg); border-radius: 4px; }
.platform-chip { font-size: 9px; font-weight: 600; padding: 1px 5px; background: var(--qaap-bg); border-radius: 3px; color: var(--qaap-text-tertiary); }
</style>
<style>
/* ═══ Ferrovial Branding Overrides ═══ */
:root {
  --ferrovial-yellow: #EBB701;
  --ferrovial-yellow-light: #FFF8E0;
  --ferrovial-yellow-dark: #C49A00;
  --ferrovial-black: #1A1A1A;
}

/* Yellow accent bar at top of sidebar */
.sidebar { border-right: none; box-shadow: 1px 0 0 var(--qaap-border); }
.sidebar::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--ferrovial-yellow); z-index: 1; }
.sidebar { position: relative; }

/* Active states in yellow */
.sidebar-item.active { background: var(--ferrovial-yellow-light); color: var(--ferrovial-black); }
.sidebar-item:hover { background: #F5F0E0; color: var(--ferrovial-black); }
.sidebar-badge { background: var(--ferrovial-yellow); color: var(--ferrovial-black); }

/* Avatar in yellow */
.avatar { background: var(--ferrovial-yellow); color: var(--ferrovial-black); }

/* Primary button override to yellow for CTAs */
.btn-primary { background: var(--ferrovial-black); }
.btn-primary:hover { background: #333; }

/* Accent details */
.stat-icon { background: var(--ferrovial-yellow-light); color: var(--ferrovial-black); }
.schedule-plan-chip { background: var(--ferrovial-yellow-light); color: var(--ferrovial-black); }
.btn-tab-active { border-color: var(--ferrovial-yellow); }

/* Yellow highlight on cards hover */
.health-plan-card:hover { border-color: var(--ferrovial-yellow); }
.connector-card:hover { border-color: var(--ferrovial-yellow); }
.schedule-card:hover { border-color: var(--ferrovial-yellow); }

/* Selection color */
::selection { background: var(--ferrovial-yellow); color: var(--ferrovial-black); }

/* Topbar yellow accent line */
.topbar { border-bottom: 2px solid var(--ferrovial-yellow); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ferrovial-data.jsx"></script>
<script type="text/babel" src="qaap-ui.jsx"></script>
<script type="text/babel" src="qaap-login.jsx"></script>
<script type="text/babel" src="qaap-dashboard.jsx"></script>
<script type="text/babel" src="qaap-health.jsx"></script>
<script type="text/babel" src="qaap-plan-detail.jsx"></script>
<script type="text/babel" src="qaap-executions.jsx"></script>
<script type="text/babel" src="qaap-proposals.jsx"></script>
<script type="text/babel" src="qaap-reports.jsx"></script>
<script type="text/babel" src="qaap-schedules.jsx"></script>
<script type="text/babel" src="qaap-connectors.jsx"></script>
<script type="text/babel" src="qaap-wizard.jsx"></script>
<script type="text/babel" src="qaap-plans-list.jsx"></script>
<script type="text/babel" src="qaap-llm-settings.jsx"></script>
<script type="text/babel" src="qaap-branding.jsx"></script>
<script type="text/babel" src="qaap-settings.jsx"></script>
<script type="text/babel" src="ferrovial-settings.jsx"></script>

<script type="text/babel">
function App() {
  const [screen, setScreen] = React.useState('login');
  const [selectedPlan, setSelectedPlan] = React.useState(null);
  const [planVariant, setPlanVariant] = React.useState('clean');
  const [showWizard, setShowWizard] = React.useState(false);


  const handleLogin = () => {
    setScreen('gate');
  };

  const handleGatePass = () => {
    setScreen('dashboard');
  };

  const handleNavigate = (id) => {
    setSelectedPlan(null);
    setScreen(id);
  };

  const handleOpenPlan = (plan) => {
    setSelectedPlan(plan || QAAP_DATA.testPlans[0]);
    setScreen('plan-detail');
  };

  if (screen === 'login') {
    return <LoginScreen onLogin={handleLogin}></LoginScreen>;
  }

  if (screen === 'gate') {
    return <PasswordGate onPass={handleGatePass}></PasswordGate>;
  }

  const breadcrumbs = [];
  if (screen === 'dashboard') breadcrumbs.push({ label: 'Dashboard' });
  else if (screen === 'health') breadcrumbs.push({ label: 'Health Dashboard' });
  else if (screen === 'plan-detail') {
    breadcrumbs.push({ label: 'Test Plans', onClick: () => handleNavigate('plans') });
    breadcrumbs.push({ label: selectedPlan?.name || 'Plan Detail' });
  } else if (screen === 'plans') breadcrumbs.push({ label: 'Test Plans' });
  else if (screen === 'executions') breadcrumbs.push({ label: 'Executions' });
  else if (screen === 'proposals') breadcrumbs.push({ label: 'AI Proposals' });
  else if (screen === 'reports') breadcrumbs.push({ label: 'Reports & Delivery' });
  else if (screen === 'schedules') breadcrumbs.push({ label: 'Scheduled Runs' });
  else if (screen === 'connectors') breadcrumbs.push({ label: 'Connectors' });
  else if (screen === 'llm-settings') { breadcrumbs.push({ label: 'Settings' }); breadcrumbs.push({ label: 'LLM Providers' }); }
  else if (screen === 'branding-settings') { breadcrumbs.push({ label: 'Settings' }); breadcrumbs.push({ label: 'Branding' }); }
  else if (screen === 'sso-settings') { breadcrumbs.push({ label: 'Settings' }); breadcrumbs.push({ label: 'SSO' }); }
  else if (screen === 'notifications-settings') { breadcrumbs.push({ label: 'Settings' }); breadcrumbs.push({ label: 'Notifications' }); }
  else if (screen === 'team-settings') { breadcrumbs.push({ label: 'Settings' }); breadcrumbs.push({ label: 'Team' }); }
  else breadcrumbs.push({ label: screen.charAt(0).toUpperCase() + screen.slice(1) });

  return (
    <div className="app-shell">
      <Sidebar currentScreen={screen} onNavigate={handleNavigate}></Sidebar>
      <div className="app-main">
        <TopBar breadcrumbs={breadcrumbs}></TopBar>
        <div className="app-content" style={screen === 'plan-detail' ? { display:'flex', flexDirection:'column', overflow:'hidden' } : {}}>
          {screen === 'dashboard' && <DashboardScreen onNavigate={handleNavigate} onOpenPlan={handleOpenPlan} onNewPlan={() => setShowWizard(true)}></DashboardScreen>}
          {screen === 'health' && <HealthScreen onNavigate={handleNavigate}></HealthScreen>}
          {screen === 'executions' && <ExecutionScreen onNavigate={handleNavigate}></ExecutionScreen>}
          {screen === 'proposals' && <ProposalsScreen onNavigate={handleNavigate}></ProposalsScreen>}
          {screen === 'reports' && <ReportsScreen onNavigate={handleNavigate}></ReportsScreen>}
          {screen === 'schedules' && <SchedulesScreen onNavigate={handleNavigate}></SchedulesScreen>}
          {screen === 'connectors' && <ConnectorsScreen onNavigate={handleNavigate}></ConnectorsScreen>}
          {screen === 'llm-settings' && <LLMSettingsScreen onNavigate={handleNavigate}></LLMSettingsScreen>}
          {screen === 'branding-settings' && <BrandingScreen onNavigate={handleNavigate}></BrandingScreen>}
          {screen === 'sso-settings' && <SSOScreen onNavigate={handleNavigate}></SSOScreen>}
          {screen === 'notifications-settings' && <NotificationsScreen onNavigate={handleNavigate}></NotificationsScreen>}
          {screen === 'team-settings' && <TeamScreen onNavigate={handleNavigate}></TeamScreen>}
          {screen === 'plan-detail' && selectedPlan && (
            <PlanDetailScreen plan={selectedPlan} onBack={() => handleNavigate('plans')} variant={planVariant} onVariantChange={setPlanVariant}></PlanDetailScreen>
          )}
          {screen === 'plans' && <TestPlansScreen onOpenPlan={handleOpenPlan} onNewPlan={() => setShowWizard(true)}></TestPlansScreen>}
          {!['dashboard','health','plan-detail','plans','executions','proposals','reports','schedules','connectors','llm-settings','branding-settings','sso-settings','notifications-settings','team-settings'].includes(screen) && (
            <div className="screen-content" style={{ opacity:1, transform:'none' }}>
              <div className="screen-header">
                <div>
                  <h1 className="screen-title">{screen.charAt(0).toUpperCase() + screen.slice(1)}</h1>
                  <p className="screen-subtitle">This screen is coming soon.</p>
                </div>
              </div>
              <div className="card" style={{ padding: 40, textAlign: 'center', color: 'var(--qaap-text-tertiary)' }}>
                <QIcon name={screen === 'proposals' ? 'proposals' : screen === 'executions' ? 'executions' : 'settings'} size={40}></QIcon>
                <p style={{ marginTop: 12 }}>This section will be built in the next iteration.</p>
              </div>
            </div>
          )}
        </div>
      </div>
      {showWizard && <NewPlanWizard onClose={() => setShowWizard(false)} onCreated={() => { setShowWizard(false); handleNavigate('plans'); }}></NewPlanWizard>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App></App>);
</script>
</body>
</html>
